name: bezorg build and release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*"
      - "[0-9]*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bezorg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: test on linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run Tests
        run: make test

  build:
    name: build ${{ matrix.goos }} / ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [test]

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Determine Version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(awk '/^SEMVER/{print $3}' Makefile)-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Build Binaries
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          make build \
            BEZORG_OUTPUT=dist/bezorg-${GOOS}-${GOARCH} \
            BEZORGD_OUTPUT=dist/bezorgd-${GOOS}-${GOARCH} \
            VERSION=${{ env.VERSION }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bezorg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/bezorg-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/bezorgd-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    concurrency:
      group: bezorg-release
      queue: max

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare Release Files
        run: |
          mkdir -p release

          (cd dist/bezorg-linux-amd64 \
            && mv bezorg-linux-amd64 bezorg \
            && mv bezorgd-linux-amd64 bezorgd \
            && sha256sum bezorg bezorgd > checksums.txt \
            && tar -cvf ../../release/bezorg-linux-amd64.tar *)

          (cd dist/bezorg-linux-arm64 \
            && mv bezorg-linux-arm64 bezorg \
            && mv bezorgd-linux-arm64 bezorgd \
            && sha256sum bezorg bezorgd > checksums.txt \
            && tar -cvf ../../release/bezorg-linux-arm64.tar *)

          (cd release && sha256sum bezorg-* > checksums.txt)
          ls -lah release

      - name: Create Versioned Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "bezorg $GITHUB_REF_NAME" \
            "${release_flags[@]}" \
            --notes "Automated release for $GITHUB_REF_NAME"
